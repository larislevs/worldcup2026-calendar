    body {

      background: #111827;
      color: #e0e6f0;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #1a2a4a 0%, #0d1b35 100%);
      border-bottom: 2px solid #c8a84b;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header .trophy { font-size: 2.2rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #c8a84b; letter-spacing: 1px; }

    .lang-switcher {
      margin-left: auto;
      display: flex;
      gap: 4px;
      background: #0a0f1e;
      border: 1px solid #2a3a55;
      border-radius: 8px;
      padding: 3px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: #8a9bb8;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }

    .lang-btn:hover  { color: #e0e6f0; }
    .lang-btn.active { background: #1a2a4a; color: #c8a84b; }

    /* ── CONTAINER ── */
    .container { max-width: 1060px; margin: 0 auto; padding: 32px 16px; }

    .grid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8a9bb8;
      font-family: 'Barlow', sans-serif;
    }

    .btn-back {
      background: transparent;
      border: 1px solid #2a3a55;
      color: #8a9bb8;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-back:hover { border-color: #c8a84b; color: #c8a84b; }

    .country-grid-wrapper {
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.3s ease;
      max-height: 2000px;
      opacity: 1;
      margin-bottom: 36px;
    }

    .country-grid-wrapper.hidden {
      max-height: 0;
      opacity: 0;
      margin-bottom: 0;
    }

    /* ── COUNTRY GRID ── */
    .country-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 36px;
    }

    .country-card {
      background: #1a2336;
      border: 1px solid #1e2d47;
      border-radius: 10px;
      padding: 14px 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      user-select: none;
    }

    .country-card:hover   { border-color: #3a4f72; background: #1e2d47; transform: translateY(-1px); }
    .country-card.active  { border-color: #c8a84b; background: #1e1c0e; }

    /* all-matches special card */
    .country-card.all-card {
      border-color: #2a3a55;
      background: #131e30;
    }

    .country-card.all-card:hover { border-color: #c8a84b; background: #1a2336; }
    .country-card.all-card.active { border-color: #c8a84b; background: #1e1c0e; }

    .country-card .flag       { font-size: 2rem; line-height: 1; }
    .country-card.all-card .flag { font-size: 1.6rem; }

    .country-card .name {
      font-size: 0.85rem;
      font-weight: 500;
      font-family: 'Barlow', sans-serif;
      color: #c0cfe0;
      text-align: center;
      line-height: 1.2;
    }

    .country-card.active .name   { color: #c8a84b; font-weight: 600; }
    .country-card.all-card .name { font-size: 0.7rem; color: #8a9bb8; }
    .country-card.all-card.active .name { color: #c8a84b; }

    .country-card .group-tag { font-size: 0.62rem; color: #4a5a75; letter-spacing: 0.5px; }
    .country-card.active .group-tag { color: #8a7a3a; }

    /* ── GAMES PANEL ── */
    .games-panel { animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .games-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .games-header .selected-flag { font-size: 1.8rem; }
    .games-header .selected-name { font-size: 1.2rem; font-weight: 700; color: #e0e6f0; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

    .games-header .selected-group {
      font-size: 0.75rem;
      background: #1a2a4a;
      border: 1px solid #2a3a55;
      color: #c8a84b;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 5px;
    }

    /* add-all button */
    .btn-add-all {
      margin-left: auto;
      background: #4285f4;
      border: none;
      color: #fff;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    .btn-add-all:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-add-all.done     { background: #2a7a5a; }

    .group-separator {
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Oswald', sans-serif;
      color: #8a9bb8;
      padding: 20px 0 8px;
      border-bottom: 1px solid #1e2d47;
      margin-bottom: 10px;
    }

    .group-separator:first-child { padding-top: 0; }

    .games-list { display: flex; flex-direction: column; gap: 10px; }

    .game-card {
      background: #1a2336;
      border: 1px solid #1e2d47;
      border-left: 3px solid #c8a84b;
      border-radius: 10px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 16px;
    }

    .game-card.finished { opacity: 0.75; }

    .game-date { text-align: center; }
    .game-date .day   { font-size: 1.5rem; font-weight: 700; color: #c8a84b; line-height: 1; font-family: 'Oswald', sans-serif; }
    .game-date .month { font-size: 0.68rem; text-transform: uppercase; color: #8a9bb8; letter-spacing: 1px; }
    .game-date .time  { font-size: 0.72rem; color: #6b7d99; margin-top: 4px; }

    .game-matchup {
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Barlow', sans-serif;
      color: #e0e6f0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .game-matchup .flag-sm { font-size: 1.1rem; }
    .game-matchup .vs      { font-size: 0.65rem; color: #4a5a75; font-weight: 400; }
    .selected-team         { color: #c8a84b !important; }

    .game-meta   { font-size: 0.72rem; color: #6b7d99; margin-top: 5px; }
    .game-result { font-size: 0.8rem; margin-top: 5px; display: flex; align-items: center; gap: 6px; }
    .result-score { font-weight: 700; font-size: 1.1rem; color: #e0e6f0; }

    .result-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-badge.win      { background: #1a3a2a; color: #4caf8a; }
    .result-badge.loss     { background: #3a1a1a; color: #cf6679; }
    .result-badge.draw     { background: #2a2a1a; color: #c8a84b; }
    .result-badge.upcoming { background: #1a2a4a; color: #8a9bb8; }

    .game-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

    .btn-calendar {
      background: transparent;
      border: 1px solid #2a3a55;
      color: #8a9bb8;
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;

      white-space: nowrap;

    .btn-calendar.added    { border-color: #4caf8a; color: #4caf8a; background: rgba(76,175,138,0.08); }

    @media (max-width: 640px) {
      .country-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      .game-card { grid-template-columns: 80px 1fr; grid-template-rows: auto auto; }
      .game-actions { grid-column: 2; flex-direction: row; }
      .btn-add-all { font-size: 0.75rem; padding: 8px 12px; }
    }

// ─── STATE ────────────────────────────────────────────────────────────────────

let lang         = "pt";
let selectedTeam = null; // null = nothing, "__all__" = all matches

// ─── LANGUAGE ─────────────────────────────────────────────────────────────────

function setLang(l) {
  lang = l;
  document.documentElement.lang = l === "pt" ? "pt-BR" : l;
  document.querySelectorAll(".lang-btn").forEach(b => {
    b.classList.toggle("active", b.textContent === l.toUpperCase());
  });
  document.getElementById("headerSub").textContent    = t("sub");
  document.getElementById("sectionLabel").textContent = t("pickTeam");
  const btnBack = document.getElementById("btnBack");
  if (btnBack.style.display !== "none") btnBack.textContent = t("back");
  rebuildGrid();
  if (selectedTeam) renderGames();
}

// ─── UTILS ────────────────────────────────────────────────────────────────────

function getTeamGroup(team) {
  for (const [g, teams] of Object.entries(GROUPS)) {
    if (teams.includes(team)) return g;
  }
  return null;
}

function getAllTeams() {
  return Object.values(GROUPS).flat().sort((a, b) =>
    tName(a).localeCompare(tName(b), lang)
  );
}

function getMatchesForTeam(team) {
  return MATCHES.filter(m => m.home === team || m.away === team);
}

function formatDateLabel(dateStr) {
  const [, mo, d] = dateStr.split("-").map(Number);
  const months = {
    pt: ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],
    es: ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],
    en: ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"],
  };
  return { day: String(d).padStart(2, "0"), month: months[lang][mo - 1] };
}

function getResultBadge(match, team) {
  if (!match.result) return `<span class="result-badge upcoming">${t("upcoming")}</span>`;
  const isHome     = !team || match.home === team;
  const myGoals    = isHome ? match.result.h : match.result.a;
  const theirGoals = isHome ? match.result.a : match.result.h;
  if (!team) return "";
  if (myGoals > theirGoals) return `<span class="result-badge win">${t("win")}</span>`;
  if (myGoals < theirGoals) return `<span class="result-badge loss">${t("loss")}</span>`;
  return `<span class="result-badge draw">${t("draw")}</span>`;
}

function matchToISOInterval(match) {
  const [y, mo, d] = match.date.split("-").map(Number);
  const [h, min]   = match.time.split(":").map(Number);
  const start = new Date(Date.UTC(y, mo - 1, d, h + 3, min));
  const end   = new Date(start.getTime() + 2 * 60 * 60 * 1000);
  return { start: start.toISOString(), end: end.toISOString() };
}

function gameCardHtml(m, team) {
  const { day, month } = formatDateLabel(m.date);
  const finished  = !!m.result;
  const homeClass = team && m.home === team ? "selected-team" : "";
  const awayClass = team && m.away === team ? "selected-team" : "";
  const scoreHtml = finished ? `<span class="result-score">${m.result.h} – ${m.result.a}</span>` : "";
  const badgeHtml = getResultBadge(m, team);
  const isAdded   = addedSet.has(m.id);

  return `
    <div class="game-card ${finished ? "finished" : ""}">
      <div class="game-date">
        <div class="day">${day}</div>
        <div class="month">${month}</div>
        <div class="time">${m.time} ${t("brt")}</div>
      </div>
      <div class="game-info">
        <div class="game-matchup">
          <span class="flag-sm">${FLAGS[m.home] || ""}</span>
          <span class="${homeClass}">${tName(m.home)}</span>
          <span class="vs">×</span>
          <span class="flag-sm">${FLAGS[m.away] || ""}</span>
          <span class="${awayClass}">${tName(m.away)}</span>
        </div>
        <div class="game-meta">${t("group")} ${m.group} · ${m.venue}</div>
        <div class="game-result">${scoreHtml}${badgeHtml}</div>
      </div>
      <div class="game-actions">
        <button
          class="btn-calendar ${isAdded ? "added" : ""}"
          data-match-id="${m.id}"
          onclick="addToCalendar(${m.id})"
          ${isAdded ? "disabled" : ""}
        >${isAdded ? t("added") : t("add")}</button>
      </div>
    </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────

function rebuildGrid() {
  const grid = document.getElementById("countryGrid");
  grid.innerHTML = "";

  // "All matches" card first
  const allCard = document.createElement("div");
  allCard.className = "country-card all-card" + (selectedTeam === "__all__" ? " active" : "");
  allCard.dataset.team = "__all__";
  allCard.innerHTML = `
    <span class="flag">🌍</span>
    <span class="name">${t("allMatches")}</span>
    <span class="group-tag">${t("allMatchesSub")}</span>`;
  allCard.addEventListener("click", () => selectTeam("__all__"));
  grid.appendChild(allCard);

  getAllTeams().forEach(team => {
    const group = getTeamGroup(team);
    const card  = document.createElement("div");
    card.className = "country-card" + (team === selectedTeam ? " active" : "");
    card.dataset.team = team;
    card.innerHTML = `
      <span class="flag">${FLAGS[team] || "🏳"}</span>
      <span class="name">${tName(team)}</span>
      <span class="group-tag">${t("group")} ${group}</span>`;
    card.addEventListener("click", () => selectTeam(team));
    grid.appendChild(card);
  });
}

function selectTeam(team) {
  selectedTeam = team;
  document.querySelectorAll(".country-card").forEach(c => {
    c.classList.toggle("active", c.dataset.team === team);
  });
  document.getElementById("gridWrapper").classList.add("hidden");
  document.getElementById("sectionLabel").style.display = "none";
  document.getElementById("btnBack").style.display = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
  renderGames();
  gtag("event", "select_team", { team_name: team, language: lang });
}

function goBack() {
  selectedTeam = null;
  document.getElementById("gridWrapper").classList.remove("hidden");
  document.getElementById("sectionLabel").style.display = "";
  document.getElementById("btnBack").style.display = "none";
  document.getElementById("gamesPanel").innerHTML = "";
  document.querySelectorAll(".country-card").forEach(c => c.classList.remove("active"));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderGames() {
  const panel = document.getElementById("gamesPanel");
  if (!selectedTeam) { panel.innerHTML = ""; return; }

  if (selectedTeam === "__all__") {
    renderAllGames(panel);
  } else {
    renderTeamGames(panel, selectedTeam);
  }
}

function addAllBtn(matchIds, label) {
  const allAdded = matchIds.every(id => addedSet.has(id));
  return `<button
    class="btn-add-all ${allAdded ? "done" : ""}"
    id="btnAddAll"
    onclick="addAllToCalendar(${JSON.stringify(matchIds)})"
    ${allAdded ? "disabled" : ""}
  >${allAdded ? t("addedAll") : label}</button>`;
}

function renderTeamGames(panel, team) {
  const group   = getTeamGroup(team);
  const matches = getMatchesForTeam(team);
  const ids     = matches.map(m => m.id);

  panel.innerHTML = `
    <div class="games-panel">
      <div class="games-header">
        <span class="selected-flag">${FLAGS[team] || "🏳"}</span>
        <span class="selected-name">${tName(team)}</span>
        <span class="selected-group">${t("group")} ${group}</span>
        ${addAllBtn(ids, t("addAll"))}
      </div>
      <div class="games-list">${matches.map(m => gameCardHtml(m, team)).join("")}</div>
    </div>`;
}

function renderAllGames(panel) {
  const allIds = MATCHES.map(m => m.id);
  let html = `
    <div class="games-panel">
      <div class="games-header">
        <span class="selected-flag">🌍</span>
        <span class="selected-name">${t("allMatches")}</span>
        ${addAllBtn(allIds, t("addAll"))}
      </div>`;

  for (const [grp, teams] of Object.entries(GROUPS)) {
    const matches = MATCHES.filter(m => m.group === grp);
    html += `<div class="group-separator">${t("group")} ${grp} · ${teams.map(tName).join(" · ")}</div>`;
    html += `<div class="games-list">${matches.map(m => gameCardHtml(m, null)).join("")}</div>`;
  }

  html += `</div>`;
  panel.innerHTML = html;
}

const CLIENT_ID = "752615313785-139j9ebqkf34r1mpdvi49dosuorrpe6s.apps.googleusercontent.com";
const SCOPES    = "https://www.googleapis.com/auth/calendar.events";
const ADDED_KEY = "copa2026_added";

let tokenClient      = null;
let accessToken      = null;
let gapiReady        = false;
let pendingAction    = null; // { type: "single"|"all", matchIds: [...] }

const addedSet = new Set(JSON.parse(localStorage.getItem(ADDED_KEY) || "[]"));

function saveAdded() {
  localStorage.setItem(ADDED_KEY, JSON.stringify([...addedSet]));
}

function initGapi() {
  gapi.load("client", async () => {
    await gapi.client.init({});
    await gapi.client.load("https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest");
    gapiReady = true;
    if (accessToken) gapi.client.setToken({ access_token: accessToken });
  });
}

function initGis() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { console.error(resp); return; }
      accessToken = resp.access_token;
      gapi.client.setToken({ access_token: accessToken });
      if (pendingAction) {
        const action = pendingAction;
        pendingAction = null;
        if (action.type === "single") await insertEvent(action.matchId);
        else await insertAll(action.matchIds);
      }
    },
  });
}

async function insertEvent(matchId) {
  if (!gapiReady) { alert(t("errLoading")); return; }
  const match = MATCHES.find(m => m.id === matchId);
  if (!match) return;

  const { start, end } = matchToISOInterval(match);
  const btn = document.querySelector(`[data-match-id="${matchId}"]`);
  if (btn) { btn.disabled = true; btn.textContent = t("adding"); }

  try {
    await gapi.client.calendar.events.insert({
      calendarId: "primary",
      resource: {
        summary:     `⚽ ${tName(match.home)} × ${tName(match.away)} — FIFA World Cup 2026`,
        description: `FIFA World Cup 2026 · ${t("group")} ${match.group}`,
        location:    match.venue,
        start: { dateTime: start, timeZone: "America/Sao_Paulo" },
        end:   { dateTime: end,   timeZone: "America/Sao_Paulo" },
      },
    });
    addedSet.add(matchId);
    saveAdded();
    if (btn) { btn.textContent = t("added"); btn.classList.add("added"); btn.disabled = false; }
    refreshAddAllBtn();
    gtag("event", "add_to_calendar", { match_id: matchId, home: match.home, away: match.away, group: match.group });
  } catch (e) {
    console.error(e);
    if (btn) { btn.textContent = t("add"); btn.disabled = false; }
    alert(t("errInsert"));
  }
}

async function insertAll(matchIds) {
  if (!gapiReady) { alert(t("errLoading")); return; }
  const addAllBtn = document.getElementById("btnAddAll");
  if (addAllBtn) { addAllBtn.disabled = true; addAllBtn.textContent = t("addingAll"); }

  const toAdd = matchIds.filter(id => !addedSet.has(id));
  for (const id of toAdd) {
    await insertEvent(id);
    await new Promise(r => setTimeout(r, 150)); // gentle rate-limit
  }

  if (addAllBtn) { addAllBtn.textContent = t("addedAll"); addAllBtn.classList.add("done"); addAllBtn.disabled = true; }
}

function refreshAddAllBtn() {
  const btn = document.getElementById("btnAddAll");
  if (!btn) return;
  const ids = JSON.parse(btn.getAttribute("onclick").match(/\[.*\]/)[0]);
  if (ids.every(id => addedSet.has(id))) {
    btn.textContent = t("addedAll");
    btn.classList.add("done");
    btn.disabled = true;
  }
}

function addToCalendar(matchId) {
  if (!accessToken) {
    pendingAction = { type: "single", matchId };
    tokenClient.requestAccessToken({ prompt: "" });
  } else {
    insertEvent(matchId);
  }
}

function addAllToCalendar(matchIds) {
  if (!accessToken) {
    pendingAction = { type: "all", matchIds };
    tokenClient.requestAccessToken({ prompt: "" });
  } else {
    insertAll(matchIds);
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
rebuildGrid();

window.addEventListener("load", () => {
  if (typeof gapi !== "undefined") initGapi();
  else document.querySelector('script[src*="api.js"]').addEventListener("load", initGapi);

  if (typeof google !== "undefined" && google.accounts) initGis();
  else document.querySelector('script[src*="gsi"]').addEventListener("load", initGis);
});
</script>
